<!DOCTYPE html>
<html>
<head><title>Juego</title>
<style>body{margin:0; overflow:hidden; background:#000} canvas{display:block; margin:auto}</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script src="Map/mapsdata.js"></script>
<script src="Map/elariondata.js"></script>
<script src="Class/Character.js"></script>
<script src="Class/Samurai/samuraidata.js"></script>
<script>
  // Esto arranca todo
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const player = new Character(SAMURAI_DATA);
  setInterval(()=>{
    ctx.clearRect(0,0,800,600);
    ctx.drawImage(ELARION_IMG, 0, 0, 800, 600);
    player.update();
    player.draw(ctx);
  }, 16);
</script>
</body>
</html>
